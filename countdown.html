<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>Baltic Tour 2026 -päivälaskuri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 32px 24px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #0b5ed7;
      font-size: 1.5rem;
    }

    #days {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 16px 0;
    }

    #updated {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #666;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>📅 Baltic Tour 2026 -päivälaskuri</h1>
    <div id="days">Lasketaan...</div>
    <div id="updated"></div>
    <div class="footer">Aika: Riika (EET / EEST)</div>
  </div>

  <script>
    function updateCountdown() {
      // Tapahtumapäivä: 13.5.2026, Riian aika (EET/EEST)
      const eventDate = new Date("2026-05-13T00:00:00+02:00");
      const now = new Date();

      const diffTime = eventDate - now;
      const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const daysElement = document.getElementById("days");
      const updatedElement = document.getElementById("updated");

      if (daysLeft > 1) {
        daysElement.innerText = `Baltic Touriin on enää ${daysLeft} päivää!`;
      } else if (daysLeft === 1) {
        daysElement.innerText = `Huomenna pelataan! ⛳`;
      } else {
        daysElement.innerText = `Tänään pelataan! ⛳`;
      }

      const dateStr = now.toLocaleDateString("fi-FI");
      const timeStr = now.toLocaleTimeString("fi-FI", {
        hour: "2-digit",
        minute: "2-digit"
      });

      updatedElement.innerText = `Päivitetty: ${dateStr} klo ${timeStr}`;
    }

    // Päivitä heti sivun latauksessa
    updateCountdown();

    // Päivitä automaattisesti kerran minuutissa
    setInterval(updateCountdown, 60000);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sää Riiassa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #0a2a82;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 25px 40px;
      text-align: center;
    }
    h1 {
      color: #0a2a82;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌤️ Sää Riiassa</h1>
    <p id="weather">Ladataan säätietoja...</p>
  </div>

  <script>
    async function getWeather() {
      try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=56.95&longitude=24.1&current=temperature_2m,weathercode&timezone=auto");
        const data = await response.json();
        const temp = Math.round(data.current.temperature_2m);
        const condition = data.current.weathercode;
        let desc = "pilvinen";
        if (condition < 3) desc = "selkeä";
        else if (condition < 45) desc = "puolipilvinen";
        else if (condition < 61) desc = "sadetta";

        document.getElementById("weather").textContent = `${desc}, ${temp}°C`;
      } catch {
        document.getElementById("weather").textContent = "Ei saatu säätietoja 😅";
      }
    }
    getWeather();
  </script>
</body>
</html>
